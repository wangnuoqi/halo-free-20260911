# Random crop only, matching baseline input augmentation. Validation is full image.
# Joint-only warm start; this does not retrain base/refine pretraining on patches.
experiment: exp3-b_joint_patch128_noaug_bs64
channels: 3
quality: 30
data_root: openclipart_5000/jpeg_pairs_512
list_dir: openclipart_5000
base_checkpoint: train_clipart_joint/ckpt/exp1-b_conv_base/convguided_exp1b_q30_best.pth
refine_checkpoint: train_clipart_joint/ckpt/exp2-b_refine_cached_aug/refine_exp2b_best.pth
output_dir: train_clipart_joint/ckpt/exp3-b_joint_patch128_noaug_bs64
train_patch_size: 128
epochs: 80
batch_size: 64
val_batch_size: 8
num_workers: 16
refine_lr: 0.003
base_lr: 0.0003
scheduler_step_size: 30
scheduler_gamma: 0.5
coarse_fidelity_weight: 0.5
augment: false
seed: 42
device: cuda:0
